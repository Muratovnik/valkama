name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Hosted jobs are not run while this repository is private. Each job skips itself
  # unless its event proves the repository public; a scheduled event never does.
  # relkit.toml declares hosted_ci = "public-only", and its audit holds every job to it.
  python:
    if: ${{ github.event.repository && !github.event.repository.private }}
    name: Python quality and tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Publication audit
        run: python .github/relkit.pyz audit --history
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Spelling
        run: typos
      - name: Dead Python code
        run: vulture server tests valkama.py vulture_whitelist.py --min-confidence 60
      - name: Python types
        run: mypy
      - name: Import boundaries
        run: lint-imports --cache-dir .cache/import-linter
      - name: Security analysis
        run: semgrep scan --config p/python --config p/security-audit --metrics off --error server valkama.py
      - name: Python tests under coverage
        run: python -m coverage run -m unittest discover -s . -p "test_*.py"
      - name: Coverage ratchet
        run: python -m coverage report

  web:
    if: ${{ github.event.repository && !github.event.repository.private }}
    name: Web quality, Settings smoke, and build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci
        working-directory: web
      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps
        working-directory: web
      - name: Web lint and unit tests
        run: npm test
        working-directory: web
      - name: Web types
        run: npm run typecheck
        working-directory: web
      - name: Production Settings browser smoke
        run: npm run test:browser -- --project=production --grep "^Settings"
        working-directory: web
      - name: Build committed web artifact
        run: npm run build
        working-directory: web
      - name: Verify committed web artifact
        run: git diff --exit-code -- web/dist

  desktop:
    if: ${{ github.event.repository && !github.event.repository.private }}
    name: Desktop tests
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Desktop tests
        run: npm test
        working-directory: desktop
