name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Hosted jobs are not run while this repository is private. Each job skips itself
  # unless its event proves the repository public; a scheduled event never does.
  # relkit.toml declares hosted_ci = "public-only", and its audit holds every job to it.
  python:
    if: ${{ github.event.repository && !github.event.repository.private }}
    name: Python quality and tests
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # semgrep has an environment of its own on the Python its pinned
      # dependencies install on (.agents/rules/quality-gates.md); set up first,
      # so that the gates' Python below stays the default `python`.
      - name: Set up Python for semgrep
        id: semgrep-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-semgrep.txt
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Publication audit
        run: python .github/relkit.pyz audit --history
      # A diagnostic readout, here and before the tests: the tests once failed to start
      # their first process with "the paging file is too small" (WinError 1455).
      - name: Memory after the publication audit
        run: |
          Get-CimInstance Win32_OperatingSystem | Format-List FreePhysicalMemory, TotalVisibleMemorySize, FreeVirtualMemory, TotalVirtualMemorySize
          Get-CimInstance Win32_PageFileUsage | Format-List Name, AllocatedBaseSize, CurrentUsage, PeakUsage
          Get-Process | Sort-Object PagedMemorySize64 -Descending | Select-Object -First 12 Name, Id, @{n = 'CommitMB'; e = { [int]($_.PagedMemorySize64 / 1MB) } }, @{n = 'WorkingSetMB'; e = { [int]($_.WorkingSet64 / 1MB) } } | Format-Table -AutoSize
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned semgrep in its own environment
        run: |
          & "${{ steps.semgrep-python.outputs.python-path }}" -m venv .venv-semgrep
          .venv-semgrep/Scripts/python -m pip install -r requirements-semgrep.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Spelling
        run: typos
      - name: Dead Python code
        run: vulture server tests valkama.py vulture_whitelist.py --min-confidence 60
      - name: Python types
        run: mypy
      - name: Import boundaries
        run: lint-imports --cache-dir .cache/import-linter
      - name: Security analysis
        run: |
          $env:PATH = "$PWD/.venv-semgrep/Scripts;$env:PATH"
          semgrep scan --config p/python --config p/security-audit --metrics off --error server valkama.py
      - name: Memory before the tests
        run: |
          Get-CimInstance Win32_OperatingSystem | Format-List FreePhysicalMemory, TotalVisibleMemorySize, FreeVirtualMemory, TotalVirtualMemorySize
          Get-CimInstance Win32_PageFileUsage | Format-List Name, AllocatedBaseSize, CurrentUsage, PeakUsage
          Get-Process | Sort-Object PagedMemorySize64 -Descending | Select-Object -First 12 Name, Id, @{n = 'CommitMB'; e = { [int]($_.PagedMemorySize64 / 1MB) } }, @{n = 'WorkingSetMB'; e = { [int]($_.WorkingSet64 / 1MB) } } | Format-Table -AutoSize
      - name: Python tests under coverage
        run: python tests/parallel.py --coverage
      - name: Coverage ratchet
        run: python -m coverage report

  web:
    if: ${{ github.event.repository && !github.event.repository.private }}
    name: Web quality, Settings smoke, and build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci
        working-directory: web
      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps
        working-directory: web
      - name: Web lint, types and unit tests
        run: npm test
        working-directory: web
      - name: Production Settings browser smoke
        # A bare Playwright run also takes every timed test of the suite, as the teardown
        # of the project it names (`tests/browser/timedChecks.ts`); the list holds the
        # step to the Settings spec, which has none.
        run: |
          Set-Content -Path "$env:RUNNER_TEMP/browser-list.txt" -Value 'production-settings.spec.ts'
          $env:VALKAMA_BROWSER_LIST = "$env:RUNNER_TEMP/browser-list.txt"
          npm run test:browser -- --project=production production-settings.spec.ts
        working-directory: web
      - name: Build committed web artifact
        run: npm run build
        working-directory: web
      - name: Verify committed web artifact
        run: git diff --exit-code -- web/dist

  desktop:
    if: ${{ github.event.repository && !github.event.repository.private }}
    name: Desktop tests
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Desktop tests
        run: npm test
        working-directory: desktop
