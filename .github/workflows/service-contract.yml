name: Service contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Hosted jobs are not run while this repository is private. Each job skips itself
  # unless its event proves the repository public; a scheduled event never does.
  check:
    if: ${{ github.event.repository && !github.event.repository.private }}
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m py_compile server/launcher.py server/cli.py tests/test_launcher.py
      - run: python -m unittest discover -s tests -p "test_launcher.py" -v
