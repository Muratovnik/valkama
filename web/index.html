<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="impeccable-direction"
      content="ec977c34"
    />
    <link
      rel="icon"
      href="/favicon.svg"
      type="image/svg+xml"
    />
    <title>Valkama</title>
    <script>
      // The rail stands where the reader left it before the application's code arrives.
      try {
        const width = Number(localStorage.getItem('valkama-navigation-width'))
        if (width > 0)
          document.documentElement.style.setProperty('--sk-chosen', `${Math.round(width)}px`)
      } catch {
        // No storage: the default rail.
      }
    </script>
    <!--
    The shell's skeleton, drawn until the application mounts over it: the rail with
    its mark and first entries, the context bar and the empty workspace panel, each
    where the application draws it, so the first frame of the application moves
    nothing. It is the shell's chrome alone and never a row of content: what the
    workspace shows waits for the read that brings it (DESIGN.md, "Read wait").
    desktop/startup_page.js draws the same skeleton while the server is found or
    started; the rail's width and its icons-only form follow shellLayout.ts.
    -->
    <style>
      :root {
        --sk-rail: clamp(200px, var(--sk-chosen, 260px), max(200px, min(480px, 100vw - 500px)));
      }
      .sk {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: var(--sk-rail) minmax(0, 1fr);
      }
      .sk-rail {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .sk-head {
        flex: none;
        height: 64px;
        padding: 17px 0 0 16px;
        color: var(--color-text-on-dark);
      }
      .sk-mark {
        display: block;
        fill: currentColor;
      }
      .sk-list {
        display: flex;
        flex-direction: column;
        padding: 16px 12px;
      }
      .sk-foot {
        margin-top: auto;
        padding: 0 12px 16px;
      }
      .sk-entry {
        position: relative;
        display: block;
        height: 40px;
      }
      .sk-entry + .sk-entry {
        margin-top: 2px;
      }
      .sk-list .sk-work {
        margin-top: 24px;
      }
      .sk-entry::before,
      .sk-entry::after {
        content: '';
        position: absolute;
        border-radius: 5px;
        background: var(--color-navigation-raised);
      }
      /* An entry's icon and the bar of its label stand where the shell's icon and the
         line of its words do: the words of a work action start at 44px, a module's at 46px. */
      .sk-entry::before {
        left: 12px;
        top: 10px;
        width: 20px;
        height: 20px;
      }
      .sk-entry::after {
        left: 44px;
        top: 14.3px;
        width: 112px;
        height: 10px;
      }
      .sk-entry:nth-child(2)::after {
        width: 124px;
      }
      .sk-work::after {
        left: 46px;
        width: 56px;
      }
      .sk-foot .sk-entry::after {
        left: 46px;
        width: 72px;
      }
      .sk-main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        container: sk-main / inline-size;
      }
      .sk-bar {
        flex: none;
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        height: 64px;
        padding: 12px 20px;
      }
      .sk-title-row {
        display: flex;
        align-items: center;
        height: 26px;
      }
      .sk-title {
        display: block;
        width: 80px;
        height: 12px;
        border-radius: 6px;
        background: var(--color-navigation-raised);
      }
      .sk-scope {
        display: flex;
        flex: none;
        gap: 12px;
        height: 40px;
      }
      .sk-choice {
        display: block;
        flex: 1 1 auto;
        width: 220px;
        border-radius: 8px;
        background: var(--color-navigation-raised);
      }
      /* The space menu's sign, which draws no fill of its own. */
      .sk-menu {
        display: block;
        flex: none;
        width: 40px;
      }
      .sk-panel {
        display: grid;
        flex: 1 1 auto;
        place-items: center;
        min-height: 0;
        background: var(--color-canvas);
        border-top-left-radius: 12px;
      }
      @media (width <= 760px) {
        :root {
          --sk-rail: 64px;
        }
        .sk-head {
          height: 24px;
          padding: 0;
        }
        .sk-mark {
          display: none;
        }
        .sk-list .sk-work {
          margin-top: 8px;
        }
        .sk-entry::before {
          left: 10px;
        }
        .sk-entry::after {
          display: none;
        }
      }
      @container sk-main (width <= 586px) {
        .sk-bar {
          flex-direction: column;
          gap: 8px;
          align-items: stretch;
          height: auto;
          padding: 8px 12px;
        }
        .sk-scope {
          gap: 8px;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <!--
    Valkama is a calm operations console for planning agent work, supervising
    live sessions, reading their evidence, and improving how the work is done.
    Direction (owner decision 2026-08-14): the Codex app look - a near-black
    ground, two zones of chrome and workspace, list-first density, statuses as a
    dot and a word, detail beside the work. DESIGN.md is the contract; this
    comment only says which product this page is.
    -->
    <div id="app">
      <div
        class="sk"
        aria-hidden="true"
      >
        <div class="sk-rail">
          <div class="sk-head">
            <svg
              class="sk-mark"
              width="30"
              height="30"
              viewBox="0 0 96 96"
            >
              <path d="M48 94L59 72L24 2H2L48 94Z" />
              <path
                d="M62.91 64.17L73 44H52.83L62.91 64.17ZM75 0L79.65 13.35L90.5 18L79.65 22.65L75 36L70.35 22.65L59.5 18L70.35 13.35L75 0Z"
              />
            </svg>
          </div>
          <div class="sk-list">
            <i class="sk-entry"></i><i class="sk-entry"></i><i class="sk-entry sk-work"></i>
          </div>
          <div class="sk-foot"><i class="sk-entry"></i></div>
        </div>
        <div class="sk-main">
          <div class="sk-bar">
            <div class="sk-title-row"><i class="sk-title"></i></div>
            <span class="sk-scope"><i class="sk-choice"></i><i class="sk-menu"></i></span>
          </div>
          <div class="sk-panel"></div>
        </div>
      </div>
    </div>
    <script
      type="module"
      src="/src/app/main.ts"
    ></script>
  </body>
</html>
