# Branch coverage of the server, measured by the suite that already exists. The
# floor is a ratchet: it is the number the suite actually reaches, so a change
# that removes a test fails here instead of passing quietly. Raise it when the
# measured figure rises; never lower it to make a run green.
[tool.coverage.run]
branch = true
# `tests.isolated`, `tests.commit_subjects`, `tests.heavy_gate`, `tests.legacy_lock`,
# `tests.parallel`, `tests.run_record` and `tests.worktree` are tools that happen to
# live beside the tests rather than tests, so they are measured like the code they
# run beside.
source = [
  "server",
  "tests.isolated",
  "tests.commit_subjects",
  "tests.heavy_gate",
  "tests.legacy_lock",
  "tests.parallel",
  "tests.run_record",
  "tests.worktree",
]
data_file = ".cache/coverage/data"

[tool.coverage.report]
# The floor is the whole number under the measured figure, raised as that
# figure rises. 76.13% when this was adopted, 77.68% once card #307 gave the
# two surfaces that had no tests some: cli went from 0% to 97% and mcp_surface
# from 27% to 60%. Layer 1 took it to 79.56% and layer 2 to 79.64%.
# Execution, scoped-read and registry regressions held the floor at 83%;
# removing the extension registry with its code and tests left 84.14%.
# The hook command and its suite took it to 85.28%, and the chain read with
# its card and graph to 86.45%. The floor stayed at 86 while the figure rose;
# 91.65%, measured on 2026-11-19, took it to 91, and since then
# `python windows/release.py coverage-margin` fails a total more than a point
# above the floor, so it cannot fall that far behind again.
fail_under = 91
precision = 2
skip_covered = true
exclude_also = [
  # Unreachable by construction on this platform or in this process, and a
  # coverage floor that counts them would be measuring the wrong thing.
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.typos.files]
extend-exclude = [
  # web/dist is committed on purpose so a clone opens the built UI with no
  # build step first. It is minified output, not authored text.
  "web/dist",
  # Third-party legal text is kept exactly as its owner wrote it, Dutch names included.
  "server/licenses",
]

[tool.typos.default]
extend-ignore-re = [
  # Git hashes quoted in documentation split into short words that read as
  # misspellings: `ba5ba23` yields `ba` twice. An all-hex run of commit length
  # is an identifier, never prose.
  "\\b[0-9a-f]{7,40}\\b",
]

[tool.typos.default.extend-words]
# Both spellings are current English and this one is what the wire validators
# and their tests have said since they were written.
unparseable = "unparseable"
